<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Admin Panel</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="header"></div>
    <div class="forceLogin"></div>
    <canvas width="3000px" height="3000px" class="bgcanvas"></canvas>
    <main>
        <div class="tabSwitchinBar"><button onclick="selectTab('addPost')">Post</button><button onclick="selectTab('addEntry')">Entry</button></div>
        <div id="addPost" class="postTab">
            <form id="addFormPost" method="POST" action="server.php">
                <input type="text" name="postForumTitle" placeholder="Title" required>
                <textarea type="text" name="postForumDesc" placeholder="Content goes here" required></textarea>
                <button type="submit" name="forumPost">Add Post</button>
            </form>
        </div>

        <div id="addEntry" class="postTab">
            <form id="addFormEntry" method="POST" action="server.php">
                <input type="text" name="disorderName" placeholder="Name" required>

                <div id="editorToolbar" class="toolbar">
                    <button type="button" data-cmd="bold"><b>B</b></button>
                    <button type="button" data-cmd="it"><i>I</i></button>
                    <button type="button" data-cmd="ul"><u>U</u></button>
                    <button type="button" data-cmd="ulist">. List</button>
                    <button type="button" id="imgBtn">Image</button>
                    <button type="button" id="vidBtn">Video</button>
                </div>

                <div id="disorderDescription" class="editable" contenteditable="true" style="min-height:200px; border:1px solid #ccc; padding:10px;"></div>

                <textarea name="description" id="realDescription" style="display:none;"></textarea>

                <input type="text" name="tags" placeholder="tags (comma separated)">
                <button type="submit" name="addDisorder">Add Disorder</button>
            </form>
        </div>
    </main>

    <div id="footer"></div>
    <script src="scripts.js"></script>
    <script>
        document.getElementById('addFormEntry').addEventListener('submit', function () {
            document.getElementById('realDescription').value = document.getElementById('disorderDescription').innerHTML;
        });

        selectTab('addPost')
    </script>
</body>
</html>
